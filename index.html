<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whitehenium (WHM) - Official Presale</title>
    <!-- Ethers.js Library for Web3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #232a3b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .presale-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
            border: 1px solid var(--accent-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-bar-bg {
            background: #232a3b;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-bar-fill {
            background: var(--accent-gradient);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 12px 16px;
            box-sizing: border-box;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .input-box input:focus {
            border-color: var(--accent-color);
        }

        .input-badge {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--accent-gradient);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-connect {
            background: #232a3b;
            margin-bottom: 15px;
        }

        .direct-address-box {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            text-align: center;
        }

        .direct-address-box p {
            margin: 0 0 6px 0;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .direct-address {
            font-family: monospace;
            font-size: 11px;
            color: var(--accent-color);
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="presale-card">
    <div class="header">
        <h1>Whitehenium (WHM)</h1>
        <div class="live-badge" id="liveStageBadge">Stage 1 Live</div>
    </div>

    <!-- Live Metrics Grid -->
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">Live BNB Price</div>
            <div class="stat-value" id="bnbPriceDisplay">$0.00</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">WHM Price</div>
            <div class="stat-value" id="whmPriceDisplay">$0.001</div>
        </div>
    </div>

    <!-- Stage Progress Bar -->
    <div class="progress-section">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary);">
            <span>Stage Sold</span>
            <span id="soldPercentage">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- Wallet Connect Button -->
    <button class="btn btn-connect" id="connectBtn" onclick="connectWallet()">Connect Wallet</button>

    <!-- Buy Input Fields -->
    <div class="input-group">
        <label>Amount in BNB</label>
        <div class="input-box">
            <input type="number" id="bnbInput" placeholder="0.0" step="0.001" oninput="calculateTokens()">
            <span class="input-badge">BNB</span>
        </div>
    </div>

    <div class="input-group">
        <label>You Will Receive (Approx)</label>
        <div class="input-box">
            <input type="text" id="tokenOutput" placeholder="0" readonly>
            <span class="input-badge">WHM</span>
        </div>
    </div>

    <button class="btn" onclick="buyTokens()">Buy WHM Tokens</button>

    <!-- Direct Contract Send Address -->
    <div class="direct-address-box">
        <p>Or send BNB directly from TrustWallet/MetaMask to:</p>
        <div class="direct-address" id="contractAddressDisplay">0xb598d65510A2d8e61FA474f33349f4a15Ec5816E</div>
    </div>
</div>

<script>
    // Configuration
    const PRESALE_CONTRACT_ADDRESS = "0xb598d65510A2d8e61FA474f33349f4a15Ec5816E";
    const ABI = [
        "function getLatestBnbPrice() public view returns (uint256)",
        "function getCurrentTokenPriceUsd() public view returns (uint256)",
        "function currentStage() public view returns (uint8)",
        "function totalTokensSold() public view returns (uint256)",
        "function buyTokens() external payable"
    ];

    let provider;
    let signer;
    let contract;
    let currentBnbPriceUsd = 720; // Fallback rate
    let currentWhmPriceUsd = 0.001;

    async function init() {
        try {
            // BSC Public RPC for Live Readings
            const rpcProvider = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org/");
            contract = new ethers.Contract(PRESALE_CONTRACT_ADDRESS, ABI, rpcProvider);
            
            await updateContractData();
            setInterval(updateContractData, 15000); // 15 sec auto refresh
        } catch (error) {
            console.error("Init Error:", error);
        }
    }

    async function updateContractData() {
        try {
            // Fetch Live BNB Price from Contract
            const bnbPriceWei = await contract.getLatestBnbPrice();
            currentBnbPriceUsd = parseFloat(ethers.utils.formatEther(bnbPriceWei));
            document.getElementById("bnbPriceDisplay").innerText = "$" + currentBnbPriceUsd.toFixed(2);

            // Fetch Current WHM Stage & Price
            const stage = await contract.currentStage();
            const whmPriceWei = await contract.getCurrentTokenPriceUsd();
            currentWhmPriceUsd = parseFloat(ethers.utils.formatEther(whmPriceWei));
            
            document.getElementById("liveStageBadge").innerText = Stage ${stage} Live;
            document.getElementById("whmPriceDisplay").innerText = "$" + currentWhmPriceUsd.toFixed(3);

            // Fetch Sold Status & Progress Bar
            const totalSoldWei = await contract.totalTokensSold();
            const totalSold = parseFloat(ethers.utils.formatEther(totalSoldWei));
            
            // Calculating stage progress (10 Cr per stage)
            const stageSold = totalSold % 100000000;
            const progressPercent = Math.min((stageSold / 100000000) * 100, 100);
            
            document.getElementById("progressBar").style.width = progressPercent.toFixed(1) + "%";
            document.getElementById("soldPercentage").innerText = progressPercent.toFixed(1) + "%";

            calculateTokens();
        } catch (error) {
            console.error("Data Fetch Error:", error);
        }
    }

    async function connectWallet() {
        if (window.ethereum) {
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                const address = await signer.getAddress();
                
                document.getElementById("connectBtn").innerText = address.substring(0, 6) + "..." + address.substring(38);
                contract = new ethers.Contract(PRESALE_CONTRACT_ADDRESS, ABI, signer);
            } catch (err) {
                alert("Wallet connection failed!");
            }
        } else {
            alert("MetaMask / TrustWallet Browser is required!");
        }
    }

    function calculateTokens() {
        const bnbAmount = parseFloat(document.getElementById("bnbInput").value);
        if (bnbAmount > 0 && currentBnbPriceUsd > 0) {
            const usdAmount = bnbAmount * currentBnbPriceUsd;
            const tokens = Math.floor(usdAmount / currentWhmPriceUsd);
            document.getElementById("tokenOutput").value = tokens.toLocaleString();
        } else {
            document.getElementById("tokenOutput").value = "";
        }
    }

    async function buyTokens() {
        const bnbAmount = document.getElementById("bnbInput").value;
        if (!bnbAmount || bnbAmount <= 0) {
            alert("Please enter a valid BNB amount!");
            return;
        }

        if (!signer) {
            await connectWallet();
            if (!signer) return;
        }

        try {
            const tx = await contract.buyTokens({
                value: ethers.utils.parseEther(bnbAmount)
            });
            alert("Transaction Submitted! Waiting for confirmation...");
            await tx.wait();
            alert("Purchase Successful! WHM Tokens transferred to your wallet.");
            updateContractData();
        } catch (error) {
            console.error("Buy Error:", error);
            alert("Transaction Failed! Check wallet balance or try direct transfer.");
        }
    }

    window.onload = init;
</script>
</body>
</html>
